name: Copy Zajel Source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  copy:
    if: ${{ !startsWith(github.event.head_commit.message, 'Copy source') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy source repository
        run: |
          git clone --depth 1 --branch main https://github.com/ffgg35646-ops/zagl.git /tmp/zagl
          rm -rf /tmp/zagl/.git
          cp -a /tmp/zagl/. .
          rm -f .github/workflows/copy-zagl.yml
          rm -f __copy_bootstrap.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Copy source from ffgg35646-ops/zagl" || exit 0
          git push origin HEAD:main
